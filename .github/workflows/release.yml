name: Release

# Publishes a signed Windows build whenever a `v*` tag is pushed. tauri-action
# builds the NSIS/MSI installers, produces the updater artifacts (.nsis.zip +
# .sig) declared by `bundle.createUpdaterArtifacts` in tauri.conf.json, and
# uploads a `latest.json` manifest to the GitHub Release — the exact URL
# MailNext's in-app updater polls (see `plugins.updater.endpoints` in
# src-tauri/tauri.conf.json).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v0.2.0) — only used for manual runs, not tag-push runs"
        required: true
        default: "v0.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          releaseName: "MailNext ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}"
          releaseDraft: true
          prerelease: false
